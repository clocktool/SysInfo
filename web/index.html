<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>设备信息查询器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-microchip"></i></div>
            <div class="brand-text">
                <h1>设备信息查询器</h1>
                <p class="brand-sub">Device Info Inspector</p>
            </div>
        </div>
        <button id="btn-refresh" class="btn btn-primary">
            <i class="fas fa-rotate-right"></i> 重新扫描
        </button>
    </header>

    <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i> 正在采集信息…
    </div>

    <div id="report" class="report hidden"></div>
</div>

<script src="app.js"></script>
</body>
</html>
